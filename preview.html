<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raman Kumar Tiwari — profile preview</title>
<style>
  :root { --bg: #05070d; --ink: #eef3ff; --mut: #7d8fba; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 1100px; margin: 0 auto; padding: 48px 20px 32px; }
  /* the five premium SVG sections read as one continuous portfolio: tighter
     rhythm between panels than between the plain-content blocks */
  section { margin: 0 0 28px; }
  section.asset-section { margin: 0 0 16px; }
  section > h2 {
    font-size: 12px; letter-spacing: 3px; text-transform: uppercase;
    color: #5b6b8f; margin: 0 0 10px; font-weight: 700;
  }
  img.asset {
    display: block; width: 100%; height: auto;
    border-radius: 20px; background: transparent;
  }
  /* clickable fallback rows under the Featured Builds and Connect panels: one
     tight inline row each, never a second list */
  .social { margin: 12px 0 0; font-size: 14.5px; color: #5b6b8f; }
  .social a { color: #cdd9f5; text-decoration: none; border-bottom: 1px solid #24314f; padding-bottom: 1px; }
  .social a:hover { color: #6ea2ff; border-bottom-color: #247bff; }
  .social .dot { color: #33415f; margin: 0 10px; }
</style>
</head>
<body>
<div class="page">

  <section class="asset-section">
    <h2>Hero</h2>
    <img class="asset" src="./assets/hero.svg?v=1" alt="Hero" width="1280" height="560">
  </section>

  <section class="asset-section">
    <h2>About</h2>
    <img class="asset" src="./assets/about-life.svg?v=1" alt="About" width="1280" height="806">
  </section>

  <section class="asset-section">
    <h2>Stack</h2>
    <img class="asset" src="./assets/stack.svg?v=1" alt="Stack" width="1280" height="860">
  </section>

  <section class="asset-section">
    <h2>Developer ID</h2>
    <img class="asset" src="./assets/id-dashboard.svg?v=1" alt="Developer ID" width="1280" height="860">
  </section>

  <section class="asset-section">
    <h2>Profile Snapshot</h2>
    <img class="asset" src="./assets/profile-snapshot.svg?v=1" alt="Profile Snapshot" width="1280" height="420">
  </section>

  <section class="asset-section">
    <h2>Education & Journey</h2>
    <img class="asset" src="./assets/journey.svg?v=1" alt="Education & Journey" width="1280" height="420">
  </section>

  <section class="asset-section">
    <h2>Experience</h2>
    <img class="asset" src="./assets/experience.svg?v=1" alt="Experience" width="1280" height="440">
  </section>

  <section class="asset-section">
    <h2>Featured Builds</h2>
    <img class="asset" src="./assets/projects.svg?v=1" alt="Featured Builds" width="1280" height="860">
    <p class="social">
      <a href="https://github.com/tiwariraman884/DeepSee">DeepSea</a><span class="dot">·</span><a href="https://github.com/tiwariraman884/promptwar">GreenStep India</a><span class="dot">·</span><a href="https://github.com/tiwariraman884/Datathon">IBM Z Fraud Detection</a><span class="dot">·</span><a href="https://github.com/tiwariraman884/MediTech">MediTech</a><span class="dot">·</span><a href="https://github.com/tiwariraman884/cinematic-3d-gamified-education">Cinematic 3D Education</a><span class="dot">·</span><a href="https://github.com/tiwariraman884/food-safety-app">Food Safety App</a>
    </p>
  </section>

  <section class="asset-section">
    <img class="asset" src="./assets/connect.svg?v=1" alt="Connect" width="1280" height="800">
    <p class="social">
      <a href="https://github.com/tiwariraman884">GitHub</a><span class="dot">·</span><a href="https://www.linkedin.com/in/raman-kumar-tiwari-698064370">LinkedIn</a><span class="dot">·</span><a href="https://www.instagram.com/rittesh3321">Instagram</a><span class="dot">·</span><a href="https://linktr.ee/tiwariraman884">Linktree</a><span class="dot">·</span><a href="mailto:tiwariraman884@gmail.com">Email</a>
    </p>
  </section>

</div>
</body>
</html>
